{% extends 'base.html' %}
{% block content %}
<h2 class="mb-3">Listado de Pacientes</h2>
<a href="{{ url_for('main.nuevo_paciente') }}" class="btn btn-primary mb-3">➕ Nuevo Paciente</a>

<table class="table table-bordered table-striped">
  <thead class="table-dark">
    <tr>
      <th>Nombre</th><th>Edad</th><th>Sexo</th><th>Teléfono</th><th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    {% for p in pacientes %}
    <tr>
      <td>{{ p.nombre }}</td>
      <td>{{ p.edad }}</td>
      <td>{{ p.sexo }}</td>
      <td>{{ p.telefono }}</td>
      <td>
        <a href="{{ url_for('main.editar_paciente', id=p.id) }}" class="btn btn-sm btn-warning">✏️</a>
        <form action="{{ url_for('main.eliminar_paciente', id=p.id) }}" method="post" style="display:inline;">
          <button type="submit" class="btn btn-sm btn-danger">🗑️</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
