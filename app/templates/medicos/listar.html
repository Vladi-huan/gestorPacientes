{% extends 'base.html' %}
{% block content %}
<h2 class="mb-3">Listado de Médicos</h2>
<a href="{{ url_for('main.nuevo_medico') }}" class="btn btn-primary mb-3">➕ Nuevo Médico</a>

<table class="table table-bordered table-striped">
  <thead class="table-dark">
    <tr>
      <th>Nombre</th>
      <th>Especialidad</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    {% for m in medicos %}
    <tr>
      <td>{{ m.nombre }}</td>
      <td>{{ m.especialidad }}</td>
      <td>
        <a href="{{ url_for('main.editar_medico', id=m.id) }}" class="btn btn-sm btn-warning">✏️</a>
        <form action="{{ url_for('main.eliminar_medico', id=m.id) }}" method="post" style="display:inline;">
          <button type="submit" class="btn btn-sm btn-danger">🗑️</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
